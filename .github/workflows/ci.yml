name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  firmware:
    name: Firmware (${{ matrix.build_type }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        build_type: [Debug, Release]
    steps:
      - uses: actions/checkout@v4

      - name: Install toolchain
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            gcc-arm-none-eabi libnewlib-arm-none-eabi cmake make
          arm-none-eabi-gcc --version

      - name: Configure
        run: >
          cmake -S . -B build -G "Unix Makefiles"
          -DCMAKE_BUILD_TYPE=${{ matrix.build_type }}
          -DKESTREL_WARNINGS_AS_ERRORS=ON
          -DKESTREL_BUILD_EXAMPLES=ON
          -DKESTREL_BUILD_BENCHMARKS=ON

      - name: Build kernel, examples and benchmarks
        run: cmake --build build -j

      - name: Upload firmware
        uses: actions/upload-artifact@v4
        with:
          name: kestrel-firmware-${{ matrix.build_type }}
          path: |
            build/examples/*.elf
            build/bench/*.elf
          if-no-files-found: error

  host-tests:
    name: Host unit tests (Unity, ASan/UBSan)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install tools
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends cmake make gcc

      - name: Configure
        run: cmake -S test -B build-test -G "Unix Makefiles"

      - name: Build
        run: cmake --build build-test -j

      - name: Run tests
        run: ctest --test-dir build-test --output-on-failure

  format:
    name: clang-format
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install clang-format
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends clang-format
          clang-format --version

      - name: Check formatting
        run: |
          git ls-files -- \
            'kernel/*.c' 'kernel/*.h' 'port/*.c' 'port/*.h' \
            'drivers/*.c' 'drivers/*.h' 'startup/*.c' 'startup/*.h' \
            'examples/*.c' 'examples/*.h' 'bench/*.c' 'bench/*.h' \
            'test/*.c' 'test/*.h' \
            | xargs clang-format --dry-run --Werror
